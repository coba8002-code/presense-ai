name: cloud-beta
on:
  pull_request:
    paths: ['cloud/**', 'supabase/**', 'backend/static/video/**', '.github/workflows/cloud-beta.yml']
  push:
    branches: [develop, 'codex/**']
    paths: ['cloud/**', 'supabase/**', 'backend/static/video/**', '.github/workflows/cloud-beta.yml']
permissions:
  contents: read
jobs:
  cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - run: npm --prefix cloud ci --ignore-scripts
      - run: npm --prefix cloud test
      - run: npm --prefix cloud audit --audit-level=high
      - run: npm --prefix cloud run build
        env:
          VITE_SUPABASE_URL: https://synthetic.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_synthetic_browser_fixture
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python .agents/skills/webapp-testing/scripts/with_server.py --server 'cd cloud && exec node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 5174 --strictPort' --port 5174 -- python cloud/tests/browser_smoke.py
      - run: npm --prefix cloud run build
      - run: PETSENSE_EXPECT_UNCONFIGURED=1 python .agents/skills/webapp-testing/scripts/with_server.py --server 'cd cloud && exec node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 5174 --strictPort' --port 5174 -- python cloud/tests/browser_smoke.py
