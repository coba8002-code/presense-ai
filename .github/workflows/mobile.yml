name: mobile-beta
on:
  push:
    branches: ['codex/**']
    paths: ['mobile/**', 'scripts/build_mobile.ps1', 'scripts/package_mobile.py', 'tests/test_mobile_package.py', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**', 'scripts/build_mobile.ps1', 'scripts/package_mobile.py', 'tests/test_mobile_package.py', '.github/workflows/mobile.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Flutter from the official repository
        shell: bash
        run: |
          git clone --depth 1 --branch 3.47.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = c197ca5199e9ee5661e865596c9c07294dfab51c
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Prepare Android SDK
        shell: bash
        run: |
          flutter config --no-analytics --android-sdk "$ANDROID_HOME"
          python - <<'PY'
          import os, subprocess
          manager = os.path.join(os.environ['ANDROID_HOME'], 'cmdline-tools/latest/bin/sdkmanager')
          subprocess.run([manager, '--licenses'], input='y\n'*80, text=True, check=True)
          subprocess.run([manager, 'platforms;android-35', 'platforms;android-36', 'build-tools;36.0.0', 'ndk;28.2.13676358', 'cmake;3.22.1'], check=True)
          PY
      - name: Resolve locked dependencies
        working-directory: mobile
        run: flutter pub get --enforce-lockfile
      - name: Static analysis
        working-directory: mobile
        run: flutter analyze
      - name: Mobile tests
        working-directory: mobile
        run: flutter test
      - name: Build Android test-signed beta
        working-directory: mobile
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: petsense-android-beta-test-signed
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
          if-no-files-found: error
