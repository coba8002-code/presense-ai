name: backend-tests
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [develop, 'codex/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --only-binary=:all: -r requirements.lock
      - run: python -m pip check
      - run: python scripts/check_environment.py
      - run: python scripts/verify_skills.py
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q backend training evaluation
