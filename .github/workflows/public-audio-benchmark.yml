name: public-dog-audio-benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-esc10:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-audio-model.txt -r local_pc/requirements-preprocess.txt
      - run: python -m pip check
      - run: python -m scripts.acquire_esc10 --output data/esc10
      - run: python local_pc/pc.py prepare-esc10 --input data/esc10 --output data/esc10-16k
      - run: python local_pc/pc.py score-esc10 --input data/esc10-16k --output artifacts/esc10-scores --limit 0
      - run: python -m evaluation.sound_benchmark --input artifacts/esc10-scores --output artifacts/esc10-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-sound-benchmark-not-dog-emotion-accuracy
          path: |
            artifacts/esc10-report.json
            artifacts/esc10-scores/
            data/esc10/inventory.json
            data/esc10/LICENSE
          retention-days: 14
